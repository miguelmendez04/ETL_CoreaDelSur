# Configuración del pipeline ETL y catálogo de fuentes.
# rol: maestra | contraste. Una sola fuente maestra por indicador.
# Los valores marcados "PENDIENTE" o "verificar" aún no se han confirmado contra la fuente.
# Las credenciales (API keys, contraseña de PostgreSQL) van en .env, nunca aquí.

rutas:
  bronze: data/bronze        # crudo por fuente y fecha: data/bronze/<fuente>/<fecha>/
  silver: data/silver
  gold: data/gold
  logs: logs
  mappings: config/mappings

logging:
  nivel: INFO
  archivo: logs/pipeline.log

base_datos:
  # Host, puerto, base, usuario y contraseña se leen de .env (PG_*)
  esquemas: [bronze, silver, gold, ctl]

calidad:
  tolerancia_suma_edades_pct: 0.5   # suma de partes (grupos de edad, H + M, si-do) vs total
  tolerancia_conciliacion_pct: 3.0  # maestra vs contraste
  # Coherencia de totales en silver (si no cuadra, la fila del total va a ctl.rechazos): por indicador de nivel,
  # los grupos de edad que deben sumar el total, y H + M ≈ T. redondeo = unidad en que publica la fuente: la EAPS
  # publica en miles, así que una diferencia de hasta medio redondeo por componente sumado no es incoherencia.
  coherencia_totales:
    POBLACION: {total: TOTAL, redondeo: 1, grupos: ["0-4", "5-9", "10-14", "15-19", "20-24", "25-29", "30-34",
                "35-39", "40-44", "45-49", "50-54", "55-59", "60-64", "65-69", "70-74", "75-79", "80-84", "85+"]}
    POB_15MAS: &eaps {total: "15+", redondeo: 1000, grupos: ["15-19", "20-29", "30-39", "40-49", "50-59", "60+"]}
    POB_ACTIVA: *eaps
    OCUPADOS: *eaps
  # Coherencia territorial (KPI): suma de los 17 si-do ≈ total nacional, por año (KOSIS, sexo y edad total).
  coherencia_territorial: [POBLACION, NACIMIENTOS, POB_15MAS, POB_ACTIVA, OCUPADOS]

periodo_historico:
  inicio: 2000
  fin: 2025

extraccion:
  reintentos: 5              # intentos por petición HTTP antes de marcar la carga como fallida
  espera_reintento_s: 5
  timeout_s: 180
  user_agent: "Mozilla/5.0 (ProyectoETL academico UAO)"   # OECD responde 403 sin User-Agent

kosis:
  # KOSIS OpenAPI está restringido a residentes de Corea (confirmado oficialmente), así que la extracción es
  # MANUAL: el equipo descarga cada tabla desde kosis.kr y guarda el CSV en data/bronze/kosis/<AAAA-MM-DD>/.
  # El extractor (src/extract/kosis.py) toma la versión más reciente de cada archivo del catálogo, valida su
  # estructura, escribe <dataset>_metadata.json y lo carga en bronze.kosis.
  metodo_extraccion: descarga_manual
  tabla_bronze: bronze.kosis
  url_tabla: https://kosis.kr/statHtml/statHtml.do?orgId={org_id}&tblId={tbl_id}
  url_portal: https://kosis.kr/eng/
  # Catálogo de extracción: un archivo = un dataset de bronze. tbl_id verificado contra el nombre oficial de cada tabla
  # en kosis.kr (statHtml.do?orgId=101&tblId=...).
  #   patron: nombre del archivo (admite *); se busca en todas las carpetas de fecha y se usa la más reciente.
  #   formato: ancho = 1 fila de encabezado con años como columnas;
  #            encabezado_doble = fila 1 periodo, fila 2 ítem (las columnas mensuales se conservan en bronze).
  archivos:
    vitales_nacional:
      patron: estadisticas_vitales_nacional_*.csv
      tabla_kosis: Vital Statistics of Korea
      org_id: "101"
      tbl_id: DT_1B8000F
      encoding: utf-8-sig
      formato: ancho
      columnas_dimension: ["By items"]
      periodo_esperado: {inicio: 2000, fin: 2025}
    vitales_sido:
      patron: estadisticas_vitales_sido_*.csv
      tabla_kosis: Vital statistics(number) by Month for Provinces
      org_id: "101"
      tbl_id: DT_1B8000G
      encoding: utf-8-sig
      formato: encabezado_doble
      columnas_dimension: ["By administrative divisions"]
      periodo_esperado: {inicio: 2000, fin: 2025}
    tfr_sido:
      patron: tfr_sido_*.csv
      tabla_kosis: Total Fertility Rates and Age-Specific Fertility Rates for city, county, and district
      org_id: "101"
      tbl_id: DT_1B81A17
      encoding: utf-8-sig
      formato: encabezado_doble
      columnas_dimension: ["By si(city), gun(county) and gu(borough)"]
      periodo_esperado: {inicio: 2000, fin: 2025}
    eaps_sido:
      patron: eaps_sido_anual_*.csv
      tabla_kosis: Summary of economically active population by city/province
      org_id: "101"
      tbl_id: DT_1DA7004S
      encoding: utf-8-sig
      formato: encabezado_doble
      columnas_dimension: ["By province"]
      periodo_esperado: {inicio: 2000, fin: 2025}
    eaps_sexo_edad:
      patron: eaps_nacional_sexo_edad_*.csv
      tabla_kosis: Summary of economically active pop. by gender/ age group
      org_id: "101"
      tbl_id: DT_1DA7012S
      encoding: utf-8-sig
      formato: encabezado_doble
      columnas_dimension: ["By gender", "By age group"]
      periodo_esperado: {inicio: 2000, fin: 2025}
    poblacion_nacional:
      patron: poblacion_nacional_edad_sexo_*_medio.csv
      tabla_kosis: Projected Population by Age(Korea)
      org_id: "101"
      tbl_id: DT_1BPA001
      encoding: utf-8-sig
      formato: ancho
      columnas_dimension: ["가정별", "성별", "연령별"]
      periodo_esperado: {inicio: 2000, fin: 2072}
    poblacion_sido:
      patron: poblacion_sido_edad_sexo_*_medio.csv
      tabla_kosis: Projected Population by Age(Province)
      org_id: "101"
      tbl_id: DT_1BPB001
      encoding: utf-8-sig
      formato: ancho
      columnas_dimension: ["By scenarios", "By province", "By gender", "By age"]
      periodo_esperado: {inicio: 2000, fin: 2052}
    proyeccion_escenarios:
      patron: proyeccion_nacional_edad_sexo_por_escenario_*.csv
      tabla_kosis: Projected population by scenario, sex and age (Korea)
      org_id: "101"
      tbl_id: null             # PENDIENTE: no es DT_1BPA401 (esa no trae sexo ni edad); copiar el tblId de la URL al abrir la tabla
      encoding: cp949            # única descarga que KOSIS entrega en CP949
      formato: ancho
      columnas_dimension: ["시나리오별", "성별", "연령별"]
      periodo_esperado: {inicio: 2022, fin: 2072}
    proyeccion_resumen:
      patron: proyeccion_nacional_resumen_*.csv
      tabla_kosis: Population Projections and Summary Indicators(Korea)
      org_id: "101"
      tbl_id: DT_1BPA002
      encoding: utf-8-sig
      formato: ancho
      columnas_dimension: ["가정별", "인구구조,부양비별"]
      periodo_esperado: {inicio: 2022, fin: 2072}
  # Uso de cada archivo por indicador (lo consume la transformación a silver):
  datasets:
    nacimientos_tfr:
      indicadores: [NACIMIENTOS, TFR]
      rol: maestra
      territorio: nacional + si-do
      archivos: [vitales_sido, tfr_sido, vitales_nacional]
      # Maestra por indicador:
      #   NACIMIENTOS -> vitales_sido, ítem "Live births(persons)" (suma 17 si-do = nacional, dif 0%).
      #   TFR         -> tfr_sido, ítem "Total Fertility Rate" (3 decimales, igual que la tabla nacional;
      #                  vitales_sido la trae con 2 decimales; diferencia máx 0.005 por redondeo).
      #   vitales_nacional: contraste interno (2025 probablemente preliminar -> estado='preliminar').
      # En silver descartar las columnas mensuales "2026.05 p)" etc.
      # Sejong vacío 2000-2011 (esperado). "Jeonnam-Gwangju" solo 2025 -> excluir. En tfr_sido Sejong se llama "sejong-si".
    poblacion_estimada:
      indicadores: [POBLACION]
      rol: maestra
      territorio: nacional + si-do
      archivos: [poblacion_nacional, poblacion_sido]
      # Ambos archivos cubren histórico 2000-2021 (población estimada) + proyección escenario medio desde 2022.
      # En silver: años <= 2025 van a fact_historico (2022-2025 marcados como proyectados), >= 2026 a fact_proyeccion.
      # Validado vs World Bank SP.POP.1564.TO: diferencias entre -0.61% y +0.33% en 2000-2024.
      # Excluir los agregados "80세이상" / "80 Years old & over" al sumar grupos; agrupar 85-89 ... 100+ en 85+.
    eaps:
      indicadores: [POB_ACTIVA, OCUPADOS, TASA_PARTICIPACION, TASA_DESEMPLEO]
      rol: maestra
      prd_se: Y               # se descargó el promedio ANUAL publicado por KOSIS (no se agrega mensual en el pipeline)
      unidad_origen: miles    # convertir a personas en silver
      territorio: nacional + si-do
      archivos: [eaps_sido, eaps_sexo_edad]
      # eaps_sido: anual 2000-2025 + mensual reciente (descartar meses). 9 ítems: pob 15+, activos, ocupados,
      #   desocupados, inactivos, tasa de participación, tasa de desempleo, tasa de empleo, tasa de empleo 15-64.
      # Sejong: solo desde 2017 (antes incluido en Chungcheongnam-do; distinto a población, que es desde 2012).
      #   Para el agregado Chungnam+Sejong recalcular las tasas desde los niveles (no sumar tasas).
      #   Tolerancia de tasas recalculadas: la del redondeo de los niveles (no ±0.1 fija).
      # "Jeonnam-Gwangju": región combinada que solo aparece en 2025 -> excluir (no está en dim_territorio).
      # eaps_sexo_edad (nacional), necesario para el escenario 6b: Total/Male/Female, mismos 8 ítems.
      # Grupos base (no se solapan): 15-19, 20-29, 30-39, 40-49, "50-59 Yeras old" (sic), 60+.
      # Agregados que NO se deben sumar: 15-24, 15-29, 15-64, Total.
      # LIMITACIÓN para 6b: los grupos son decenales y el último es abierto (60+), mientras la proyección es quinquenal.
      #   Mapeo: 15-19 -> 15-19; 20-24+25-29 -> 20-29; ... ; 60-64 y 65+ -> tasa única de 60+ (documentarlo como supuesto).
    proyeccion_nacional:
      indicadores: [POBLACION]
      rol: maestra
      nivel: proyeccion
      edicion_proyeccion: KOSTAT_2022_2072
      escenarios: [medio, alto, bajo, migracion_alta, migracion_baja, sin_migracion, envejecimiento_rapido, envejecimiento_lento]
      archivos: [poblacion_nacional, proyeccion_escenarios, proyeccion_resumen]
      # El archivo de escenarios trae 28 variantes y NO incluye el medio puro:
      #   medio -> poblacion_nacional ("중위 추계")
      #   alto  -> proyeccion_escenarios, "높은 출산율 추계" (fecundidad alta, resto medio)
      #   bajo  -> proyeccion_escenarios, "낮은 출산율 추계" (fecundidad baja, resto medio)
      # proyeccion_escenarios: CP949, columnas de año "2022 년", columnas extra 항목/단위 y una vacía al final.
      periodo: {inicio: 2022, fin: 2072}
    proyeccion_provincial:
      indicadores: [POBLACION]
      rol: maestra
      nivel: proyeccion
      edicion_proyeccion: KOSTAT_2022_2052
      escenarios: [medio]     # el documento solo exige escenarios para la proyección nacional
      archivos: [poblacion_sido]
      periodo: {inicio: 2026, fin: 2052}
      # Validado: suma de 17 si-do = Whole country (dif 0%); Whole country = tabla nacional (dif 0% en 2000-2052).
      # Sejong vacío en 2000-2011 (esperado: si-do desde 2012) -> usar agregado Chungnam+Sejong.

worldbank:
  metodo_extraccion: api
  tabla_bronze: bronze.worldbank_wdi
  base_url: https://api.worldbank.org/v2
  # GET {base_url}/country/{paises}/indicator/{codigo}?format=json&date={inicio}:{fin}&per_page=20000
  # Los países se separan con ';' (con ',' la API devuelve 0 registros). Periodo = periodo_historico.
  per_page: 20000
  paises: [KOR, JPN, USA, DEU, ITA, ESP, FRA, CHN, OED]
  datasets:
    SP.DYN.TFRT.IN:    {indicador: TFR,                rol: contraste}
    SP.POP.65UP.TO.ZS: {indicador: PROP_65MAS,         rol: contraste}
    SP.POP.1564.TO:    {indicador: POBLACION,          rol: contraste, grupo_edad: "15-64"}
    SL.TLF.CACT.ZS:    {indicador: TASA_PARTICIPACION, rol: contraste}   # modelado OIT, 15+
    SP.DYN.CBRT.IN:    {indicador: NACIMIENTOS,        rol: contraste, nota: "tasa bruta por 1000; nacimientos = tasa x SP.POP.TOTL / 1000"}
    SP.POP.DPND.OL:    {indicador: DEPENDENCIA_VEJEZ,  rol: contraste}
    SP.POP.TOTL:       {indicador: POBLACION,          rol: contraste, grupo_edad: TOTAL, nota: "también sirve para convertir la tasa bruta de natalidad en nacimientos"}
    SP.POP.0014.TO:    {indicador: POBLACION,          rol: contraste, grupo_edad: "0-14", nota: "con SP.POP.65UP.TO permite calcular el índice de envejecimiento de contraste"}
    SP.POP.65UP.TO:    {indicador: POBLACION,          rol: contraste, grupo_edad: "65+"}
    SL.GDP.PCAP.EM.KD: {indicador: PIB_OCUPADO,        rol: contraste, nota: "PIB por ocupado (USD PPA constantes); contraste de productividad según Tabla 2 del documento. Mide por ocupado, no por hora"}

oecd:
  metodo_extraccion: api
  tabla_bronze: bronze.oecd_sdmx
  # Todas las consultas usan /public/rest con header User-Agent (sin él la API responde 403).
  # Sin API key. Formato csvfilewithlabels (el jsondata repite claves de serie y Python pierde datos al parsearlo).
  base_url: https://sdmx.oecd.org/public/rest
  # GET {base_url}/data/{dataflow}/{clave}?startPeriod={periodo.inicio}&format=csvfilewithlabels
  formato: csvfilewithlabels
  paises_comparacion: [KOR, JPN, USA, DEU, ITA, ESP, FRA]
  # Regiones TL3 de Corea (17 si-do) incluidas en la consulta de fecundidad; quedan en bronze sin uso (sección 4.2).
  regiones_kor_tl3: [KR011, KR012, KR013, KR021, KR022, KR023, KR031, KR032, KR041, KR042, KR043, KR051, KR052, KR053, KR054, KR061, KR071]
  # En 'clave', {paises} y {regiones_kor_tl3} se reemplazan por las listas de arriba unidas con '+'.
  datasets:
    productividad:
      indicadores: [PIB_HORA]
      rol: maestra
      dataflow: OECD.SDD.TPS,DSD_PDB@DF_PDB,2.0        # "Productivity database" (versión vigente)
      # dims: REF_AREA.FREQ.MEASURE.ACTIVITY.UNIT_MEASURE.PRICE_BASE.TRANSFORMATION.ASSET_CODE.CONVERSION_TYPE
      # PIB por hora, total economía, USD PPA, volumen encadenado (precios constantes, base 2020), sin transformar
      # (TRANSFORMATION=N; sin ese filtro para USA llega también la tasa de crecimiento anual). Corea es la maestra;
      # los demás países y el promedio OCDE son comparación internacional (pregunta 9).
      clave: "{paises}+OECD.A.GDPHRS._T.USD_PPP_H.LR.N.."
      periodo: {inicio: 2000, fin: 2025}               # confirmado: 26/26 años
      nota: >
        Reemplaza a DSD_PDB@DF_PDB_LV,1.0 (archivado), que para Corea solo tenía 2011-2023.
        En los años comunes los valores son casi iguales (2011: 37.7 en ambas; 2023: 51.0 archivada vs 51.1 vigente, por revisión de datos).
    fuerza_laboral:
      indicadores: [POB_ACTIVA, OCUPADOS, TASA_PARTICIPACION, TASA_DESEMPLEO]
      rol: contraste
      dataflow: OECD.SDD.TPS,DSD_ALFS@DF_SUMTAB,1.0    # "Annual labour force survey, summary tables"
      # dims: REF_AREA.MEASURE.UNIT_MEASURE.TRANSFORMATION.SEX.AGE.WORKER_STATUS.ACTIVITY.FREQ
      clave: "{paises}.LF+EMP+EMP_WAP+UNE_LF.......A"
      medidas: {LF: POB_ACTIVA, EMP: OCUPADOS, EMP_WAP: TASA_EMPLEO, UNE_LF: TASA_DESEMPLEO}
      periodo: {inicio: 2000, fin: 2025}               # confirmado para KOR, por sexo, edad 15+
      # FILTROS: AGE=Y_GE15; niveles en UNIT_MEASURE=PS, que vienen en MILES (UNIT_MULT=3 -> valor x 10**UNIT_MULT);
      #   tasas en PT_* (TRANSFORMATION=G1, no filtrar por _Z); descartar IX (índices);
      #   EMP en PS además requiere WORKER_STATUS=_Z y ACTIVITY=_Z (si no, mezcla asalariados/sectores).
      # LF_WAP NO se publica en DF_SUMTAB (solo EMP, EMP_WAP, LF, UNE, UNE_LF): el contraste de la tasa de
      #   participación se hace con WB SL.TLF.CACT.ZS, o derivándola por sexo como EMP_WAP / (1 - UNE_LF/100).
    fecundidad_nacimientos:
      indicadores: [TFR, NACIMIENTOS]
      rol: contraste
      dataflow: OECD.CFE.EDS,DSD_REG_DEMO@DF_FERTILITY,2.4   # "Fertility - Regions" (incluye nivel país)
      # dims: FREQ.TERRITORIAL_LEVEL.REF_AREA.TERRITORIAL_TYPE.MEASURE.AGE.SEX.UNIT_MEASURE
      clave: "A..{paises}+{regiones_kor_tl3}..FERT_RATIO+LIVE_BIRTHS..."
      medidas: {FERT_RATIO: TFR, LIVE_BIRTHS: NACIMIENTOS}
      periodo: {inicio: 2000, fin: 2024}
      # FILTROS OBLIGATORIOS (el archivo mezcla series y promediarlas da valores absurdos):
      #   TFR         -> MEASURE=FERT_RATIO, AGE=_T   (las demás AGE son tasas específicas por edad, por mujer en el grupo quinquenal)
      #   NACIMIENTOS -> MEASURE=LIVE_BIRTHS, UNIT_MEASURE=BR   (10P3HB es la tasa bruta por 1000 habitantes)
      # Validado KOR 2000-2024: TFR idéntica a World Bank; nacimientos vs WB (tasa x población) entre -1.2% y +2.1%.
      nota: >
        Trae país (CTRY) y también los 17 si-do de Corea (nivel TL3: KR011 Seúl ... KR071 Jeju; Sejong KR054 desde 2012).
        El documento (sección 4.2) dice que las fuentes internacionales solo se usan a nivel país:
        el nivel si-do queda descargado en bronze pero NO se usa salvo que el equipo cambie esa decisión.
    dependencia_vejez:
      indicadores: [DEPENDENCIA_VEJEZ]
      rol: contraste
      dataflow: OECD.ELS.SAE,DSD_POPULATION@DF_POP_HIST,1.0  # "Historical population data"
      clave: "{paises}.DEPEND_RATIO_OLD...."
      periodo: {inicio: 2000, fin: 2025}
      nota: OJO, OECD define 65+ / 20-64 (no 15-64). No es comparable 1 a 1 con nuestro cálculo; documentar en la conciliación.
    participacion_edad_sexo:
      indicadores: [TASA_PARTICIPACION]
      rol: contraste             # insumo del escenario C (convergencia al promedio OCDE), no reemplaza a la EAPS
      dataflow: OECD.SDD.TPS,DSD_LFS@DF_IALFS_LF_WAP_Q,1.0   # "Labour force participation rate" por sexo y edad
      # dims: REF_AREA.MEASURE.UNIT_MEASURE.TRANSFORMATION.ADJUSTMENT.SEX.AGE.ACTIVITY.FREQ
      clave: "KOR+OECD.LF_WAP...N....A"                      # Corea y promedio OCDE, anual, sin desestacionalizar
      medidas: {LF_WAP: TASA_PARTICIPACION}
      periodo: {inicio: 2015, fin: 2025}
      nota: >
        Edades publicadas: 15-24, 25-54, 55-64, 15-64 y 15+. El promedio OCDE llega a 2024 (Corea a 2025).

unwpp:
  # API REST oficial (no descarga CSV manual). Requiere token gratuito.
  metodo_extraccion: api
  tabla_bronze: bronze.unwpp_wpp2024
  page_size: 1000          # máximo que acepta la API; con el valor por defecto (100) son ~540 páginas
  base_url: https://population.un.org/dataportalapi/api/v1
  # Token: solicitar en https://population.un.org/dataportalapi/token/index.html
  # (formulario o correo a population@un.org, asunto "Data Portal Token Request"; sin restricción de residencia)
  token_env: UNWPP_API_TOKEN
  edicion: WPP2024
  datasets:
    poblacion_edad_sexo:
      indicadores: [POBLACION]
      rol: contraste
      indicator_id: 46         # confirmado: "Population by 5-year age groups and sex"
      variantes: [Medium, High, Low]
      location_code: 410      # Republic of Korea
      periodo: {inicio: 2000, fin: 2072}
      nota: sin token, la API responde 401; con token es GET {base_url}/data/indicators/46/locations/410/start/{inicio}/end/{fin}
      unidad_valor: personas (NO miles) -- verificado en EDA sumando poblacion total 2020 (~51.86M, coincide con Corea real)
      variantes_a_usar: {Median: 4, High-fertility: 9, Low-fertility: 10}   # el bronze trae 17 variantes en total, filtrar a estas 3
      cobertura: Median 2000-2072 sin huecos; High/Low-fertility solo 2024-2072 (antes no hay divergencia de escenario)

silver:
  # Reglas de transformación bronze -> silver. Salen del perfilamiento (notebooks 01-05).
  # Silver se reconstruye completo en cada ejecución desde la última carga exitosa de cada dataset de bronze.
  periodo_historico_hasta: 2025       # años <= van a fact_historico; > van a fact_proyeccion
  proyeccion_desde: 2026
  # Ítems de KOSIS que pasan a silver -> indicador y factor de unidad (miles -> personas = 1000).
  # Los demás ítems quedan solo en bronze (fuera del alcance del proyecto).
  items_kosis:
    vitales_nacional:   # solo lo que no trae la tabla por si-do (la esperanza de vida, por sexo)
      "Life expectancy at birth-total(age)": {indicador: ESPERANZA_VIDA, sexo: Total}
      "Life expectancy at birth-male(age)": {indicador: ESPERANZA_VIDA, sexo: Male}
      "Life expectancy at birth-female(age)": {indicador: ESPERANZA_VIDA, sexo: Female}
    vitales_sido:
      "Live births(persons)": {indicador: NACIMIENTOS}
      "Deaths(persons)": {indicador: DEFUNCIONES}
      "Natural increase(persons)": {indicador: CRECIMIENTO_NATURAL}
    tfr_sido:
      "Total Fertility Rate": {indicador: TFR}
    eaps:   # eaps_sido y eaps_sexo_edad
      "Population 15 years old and over (Thousand Person)": {indicador: POB_15MAS, factor: 1000}
      "Economically active population (Thousand Person)": {indicador: POB_ACTIVA, factor: 1000}
      "Employed persons (Thousand Person)": {indicador: OCUPADOS, factor: 1000}
      "Labor Force Participation rate (%)": {indicador: TASA_PARTICIPACION}
      "Unemployment rate (%)": {indicador: TASA_DESEMPLEO}
  # Grupos de edad de las tablas KOSIS que NO pasan a silver porque se solapan con otros (se recalculan o no se usan).
  edades_excluidas: ["80+", "15-24", "15-29"]
  # Grupos finos que se suman en uno de dim_edad.
  edades_agrupadas: {"85-89": "85+", "90-94": "85+", "95-99": "85+", "100+": "85+"}
  # Agregados de edad que se calculan sumando grupos quinquenales (para fuentes que no los traen).
  agregados_edad: {"0-14": ["0-4", "5-9", "10-14"],
                   "15-64": ["15-19", "20-24", "25-29", "30-34", "35-39", "40-44", "45-49", "50-54", "55-59", "60-64"],
                   "65+": ["65-69", "70-74", "75-79", "80-84", "85+"]}
  # Agregado territorial Chungnam + Sejong (antes de que Sejong exista, Chungnam ya lo incluye).
  agregado_cnsj: {codigo: CNSJ, componentes: ["34", "29"],
                  indicadores_suma: [POBLACION, NACIMIENTOS, DEFUNCIONES, CRECIMIENTO_NATURAL, POB_15MAS, POB_ACTIVA,
                                     OCUPADOS]}
  ediciones:
    kosis_nacional: KOSTAT_2022_2072
    kosis_sido: KOSTAT_2022_2052
  # Estado 'preliminar': último año publicado y población 2022-2025 de KOSIS (viene de la proyección, no es estimación).
  preliminar:
    ultimo_anio: 2025
    poblacion_proyectada_kosis: {desde: 2022, hasta: 2025}
  # World Bank: indicadores que pasan a fact_historico para los países de comparación (KOR solo va a conciliación,
  # porque para Corea la maestra es KOSIS).
  worldbank_historico:
    SP.DYN.TFRT.IN: {indicador: TFR}
    SP.POP.TOTL: {indicador: POBLACION, grupo_edad: TOTAL}
    SP.POP.0014.TO: {indicador: POBLACION, grupo_edad: "0-14"}
    SP.POP.1564.TO: {indicador: POBLACION, grupo_edad: "15-64"}
    SP.POP.65UP.TO: {indicador: POBLACION, grupo_edad: "65+"}
    SL.TLF.CACT.ZS: {indicador: TASA_PARTICIPACION, grupo_edad: "15+"}
    SL.GDP.PCAP.EM.KD: {indicador: PIB_OCUPADO}

gold:
  # Los parámetros de esta sección son decisiones metodológicas del equipo, no datos de una fuente. Su
  # justificación y sensibilidad están en el README ("Supuestos del modelo"). Si se cambia alguno, subir version_modelo.
  version_modelo: v2   # v2: se agrega el supuesto D (brecha de género)
  # Pregunta 6b: fuerza laboral potencial = población proyectada KOSTAT (edición nacional, 3 escenarios)
  #              × tasa de participación por sexo y grupo de edad de la EAPS. Son ESCENARIOS, no pronósticos.
  escenarios_fuerza_laboral:
    anio_base: 2025
    # Escenarios de KOSTAT sobre los que se calculan los supuestos (el tablero permite elegir cualquiera de ellos).
    escenarios_kostat: [medio, alto, bajo, migracion_alta, migracion_baja, sin_migracion, envejecimiento_rapido,
                        envejecimiento_lento]
    # La EAPS cubre la población civil no institucional (sin militares ni personas en instituciones), menor que la
    # población total de KOSTAT. Factor por sexo y grupo = pob 15+ EAPS / pob KOSTAT en el año base; sin él la
    # fuerza laboral del año base queda ~1.5 % sobre la observada.
    calibrar_cobertura_eaps: true
    # Grupos de la EAPS (decenales, 60+ abierto) armados con los quinquenales de la proyección.
    grupos: {"15-19": ["15-19"], "20-29": ["20-24", "25-29"], "30-39": ["30-34", "35-39"],
             "40-49": ["40-44", "45-49"], "50-59": ["50-54", "55-59"],
             "60+": ["60-64", "65-69", "70-74", "75-79", "80-84", "85+"]}
    supuestos:
      A:
        nombre: Participación constante
        descripcion: Cada tasa por sexo y grupo de edad se mantiene en su valor del año base.
      B:
        nombre: Tendencia 2015-2025 con tope
        descripcion: >
          Se extrapola la tendencia lineal 2015-2025 de cada tasa por sexo y grupo de edad, con un cambio máximo
          respecto al año base, acotada entre un piso y un tope, y congelada desde el año límite (las tendencias
          no siguen indefinidamente).
        anios_tendencia: [2015, 2025]
        cambio_maximo_pp: 15   # puntos porcentuales, hacia arriba o hacia abajo
        piso: 0
        tope: 90
        congelar_desde: 2050
      C:
        nombre: Convergencia al promedio OCDE
        descripcion: >
          Cada tasa converge linealmente a la del promedio OCDE para su sexo y edad, que alcanza en el año de
          convergencia y mantiene después. Los grupos 15-19 y 60+ se mantienen constantes: la OCDE solo publica
          15-24 (mezcla estudiantes con jóvenes que ya trabajan) y no publica 65+ por sexo.
        anio_convergencia: 2050
        # Grupo EAPS -> pesos sobre las edades que publica la OCDE (DSD_LFS@DF_IALFS_LF_WAP_Q).
        equivalencias_oecd: {"20-29": {Y15T24: 0.5, Y25T54: 0.5}, "30-39": {Y25T54: 1},
                             "40-49": {Y25T54: 1}, "50-59": {Y25T54: 0.5, Y55T64: 0.5}}
      D:
        nombre: Cierre de la mitad de la brecha de género
        descripcion: >
          La tasa femenina de cada grupo de edad cierra linealmente una fracción de su brecha con la masculina entre
          el año base y el año meta, y luego se mantiene; la masculina queda constante (como en A). Donde las
          mujeres ya participan más (15-29), la tasa no se toca: cerrar la brecha nunca baja una tasa.
        fraccion_cierre: 0.5
        anio_meta: 2050
    # Sensibilidad: cada variante reemplaza parámetros de un supuesto (resultado en gold.escenarios_sensibilidad).
    sensibilidad:
      B: [{cambio_maximo_pp: 10}, {cambio_maximo_pp: 20}, {congelar_desde: 2040}, {congelar_desde: 2060}]
      C: [{anio_convergencia: 2040}, {anio_convergencia: 2060}]
      D: [{fraccion_cierre: 0.25}, {fraccion_cierre: 1.0}]
  # Pregunta 5: índice de riesgo demográfico por si-do (descriptivo, no causal). Cada componente se normaliza
  # 0-100 entre los 17 si-do (100 = más riesgo) y se promedia con su peso.
  riesgo_sido:
    anio_base: 2025
    anio_proyeccion: 2052
    componentes:
      prop_65mas: {peso: 0.25, mas_es_peor: true}
      tfr: {peso: 0.25, mas_es_peor: false}
      var_pob_15_64_proy_pct: {peso: 0.25, mas_es_peor: false}
      dependencia_vejez_proy: {peso: 0.25, mas_es_peor: true}
    # Sensibilidad: el ranking se recalcula con otros pesos (la dirección de cada componente no cambia).
    esquemas_sensibilidad:
      solo_situacion_actual: {prop_65mas: 0.5, tfr: 0.5}
      solo_proyeccion: {var_pob_15_64_proy_pct: 0.5, dependencia_vejez_proy: 0.5}
      envejecimiento_doble: {prop_65mas: 0.4, tfr: 0.2, var_pob_15_64_proy_pct: 0.2, dependencia_vejez_proy: 0.2}
      natalidad_doble: {prop_65mas: 0.2, tfr: 0.4, var_pob_15_64_proy_pct: 0.2, dependencia_vejez_proy: 0.2}
      # Índice alternativo de 6 componentes estandarizados (z) con igual peso, como el que propuso el equipo en la
      # versión paralela del proyecto: agrega dependencia y participación actuales y el reemplazo laboral.
      seis_componentes_z: {prop_65mas: 1, tfr: 1, dependencia_vejez: 1, tasa_participacion: 1, reemplazo_laboral: 1,
                           var_pob_15_64_proy_pct: 1, normalizacion: zscore}
    # Dirección de los componentes que solo usan los esquemas de sensibilidad.
    componentes_extra:
      dependencia_vejez: {mas_es_peor: true}
      tasa_participacion: {mas_es_peor: false}
      reemplazo_laboral: {mas_es_peor: false}   # 15-24 por cada 100 de 55-64 en el año base
    # Y con pesos base pero otra normalización: percentil no depende de valores extremos (Sejong crece +11 % en 15-64
    # mientras el resto cae; en min-max eso comprime la escala de los otros 16 si-do).
    normalizaciones_sensibilidad: [percentil]

  # Pregunta 8: señales tempranas de escasez laboral.
  senales_escasez:
    umbrales_dependencia: [50, 75]          # personas de 65+ por cada 100 de 15-64
    anios_comparacion: [2030, 2040, 2050, 2072]
    # Migración como palanca: cambio de la población 15-64 al año dado en cada escenario de migración de KOSTAT.
    escenarios_migracion: [medio, sin_migracion, migracion_baja, migracion_alta]
    anio_migracion: 2050

  # Pregunta 7: pares de indicadores (Corea, 2000-2025) cuya asociación se mide. Asociación, no causalidad.
  asociaciones:
    - [PROP_65MAS, TASA_PARTICIPACION]
    - [PROP_65MAS, OCUPADOS]
    - [PROP_65MAS, TASA_DESEMPLEO]
    - [PROP_65MAS, PIB_HORA]
    - [DEPENDENCIA_VEJEZ, PIB_HORA]
    - [TFR, TASA_PARTICIPACION]
